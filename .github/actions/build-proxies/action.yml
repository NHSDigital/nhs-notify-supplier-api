name: "Build Proxies"
description: "Build Proxies"

inputs:
  version:
    description: "Version number"
    required: false
  releaseVersion:
    description: "Release, tag, branch, or commit ID to be used for deployment"
    required: true
  isRelease:
    description: "True if releaseVersion is a release tag (if set, downloads from release assets instead of workflow artifacts)"
    required: false
    default: false
  environment:
    description: "Deployment environment"
    required: true
  apimEnv:
    description: |
      OAS build configuration name (e.g. internal-dev-pr, internal-dev, int, prod).
      Must match the apimEnv used to build the OAS artifact this action downloads.
      The '-pr' suffix is stripped before dispatching to proxygen, which only knows
      real APIM environments (internal-dev, internal-dev-sandbox, int, ref, prod).
    required: true
  runId:
    description: "GitHub Actions run ID to fetch the OAS artifact from"
    required: true
  targetComponent:
    description: "Name of the Component to deploy"
    required: true
    default: 'api'

runs:
  using: composite

  steps:
    - name: Download OAS Spec artifact from workflow
      if: ${{ inputs.isRelease == 'false' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: api-oas-specification-${{ inputs.apimEnv }}${{ inputs.version != '' && format('-{0}', inputs.version) || '' }}
        path: ./build

    - name: Download OAS Spec artifact from release
      if: ${{ inputs.isRelease == 'true' }}
      shell: bash
      run: |
        mkdir ./build
        ASSET_PATTERN="api-oas-specification-${{ inputs.apimEnv }}-*.zip"
        gh release download "${{ inputs.releaseVersion }}" \
          --pattern "$ASSET_PATTERN" \
          --dir ./build
        # Unzip the downloaded file (there should be exactly one match)
        ASSET_FILE=$(ls ./build/api-oas-specification-${{ inputs.apimEnv }}-*.zip)
        unzip "$ASSET_FILE" -d ./build
        rm "$ASSET_FILE"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Setup Proxy Name and target
      shell: bash
      run: |
        set -euo pipefail

        ENV="${{ inputs.apimEnv }}"
        if [[ "$ENV" == "internal-dev" || "$ENV" == "internal-dev-pr" ]]; then
          echo "TARGET_DOMAIN=suppliers.dev.nhsnotify.national.nhs.uk" >> $GITHUB_ENV
        elif [[ "$ENV" == "int" || "$ENV" == "ref" ]]; then
          echo "TARGET_DOMAIN=suppliers.nonprod.nhsnotify.national.nhs.uk" >> $GITHUB_ENV
        elif [[ "$ENV" == "prod" ]]; then
          echo "TARGET_DOMAIN=suppliers.prod.nhsnotify.national.nhs.uk" >> $GITHUB_ENV
        else
          echo "[ERROR] Unsupported apimEnv '$ENV'."
          exit 1
        fi

    - name: Set APIM_ENV
      # apimEnv carries the OAS build configuration name (e.g. "internal-dev-pr")
      # which determines auth level, target secrets, and artifact naming.
      # Proxygen and the internal proxy-deploy/proxy-destroy workflows only know
      # real APIM environments, so we strip the "-pr" suffix here - this is the
      # single translation boundary between OAS build config and APIM deployment.
      shell: bash
      run: |
        APIM_ENV="${{ inputs.apimEnv }}"
        if [[ $APIM_ENV == *-pr ]]; then
          echo "Removing pr suffix from APIM_ENV after building OAS and calling proxygen"
          APIM_ENV=$(echo "$APIM_ENV" | sed 's/-pr$//')
        fi
        echo "APIM_ENV=$APIM_ENV" >> $GITHUB_ENV

    - name: Upload OAS Spec
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.APIM_ENV }}-build-output
        path: ./build

    # NOTE TO SELF: remove --internalRef after internal is merged into main
    - name: Trigger deploy proxy
      env:
        APP_CLIENT_ID: ${{ env.APP_CLIENT_ID }}
        APP_PEM_FILE: ${{ env.APP_PEM_FILE }}
      shell: bash
      run: |
        .github/scripts/dispatch_internal_repo_workflow.sh \
          --infraRepoName "nhs-notify-supplier-api" \
          --releaseVersion "${{ inputs.releaseVersion }}" \
          --targetComponent "${{ inputs.targetComponent }}" \
          --targetWorkflow "proxy-deploy.yaml" \
          --targetEnvironment "${{ inputs.environment }}" \
          --runId "${{ inputs.runId }}" \
          --apimEnvironment "${{ env.APIM_ENV }}" \
          --boundedContext "notify-supplier" \
          --targetDomain "$TARGET_DOMAIN" \
          --version "${{ inputs.version }}" \
          --internalRef "fix/CCM-22538_deploy_sandbox_server"
