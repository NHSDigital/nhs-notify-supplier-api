repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            internal/events/.*/.*\.schema\.json
          )$
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: pretty-format-json
        args: ['--autofix']
        exclude: |
            (?x)^(
                package(-lock)?\.json$ |
                sdk/.* |
                someotherdir/.* |
                src/server/host/Properties/launchSettings.json |
                tests/contracts/provider/tsconfig.json |
                internal/events/.*/.*\.schema\.json
            )$

  - repo: https://github.com/NHSDigital/nhs-notify-shared-modules
    rev: a818108235ee15a5f49bcecf62f4732b94246f67 # 6.1.0
    hooks:
      - id: scan-secrets
        args: [check=staged-changes]
      - id: check-file-format
        args: [check=branch]
      - id: check-markdown-format
        args: [check=branch]
      - id: lint-terraform
      - id: check-todo-usage
        args: [check=branch]
      - id: scan-dependencies # make githooks-dependencies
        stages: [manual]
