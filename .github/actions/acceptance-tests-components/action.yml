name: Acceptance tests - component
description: "Run component acceptance tests for this repo"

inputs:
  testType:
    description: Type of test to run
    required: true

  targetEnvironment:
    description: Name of the environment under test
    required: true

  targetComponent:
    description: Name of the component under test
    required: true

  targetAccountGroup:
    description: Name of the account group under test (e.g. nhs-notify-supplier-api-dev)
    required: true

runs:
  using: "composite"

  steps:

    - name: "Set PR NUMBER"
      if: ${{ inputs.testType == 'sandbox' }}
      id: set_pr_number
      shell: bash
      run: |
        env="${{ inputs.targetEnvironment }}"
        if [[ "$env" == main ]]; then
          echo "pr_number=" >> "$GITHUB_OUTPUT"
        elif [[ "$env" == pr* ]]; then
          echo "pr_number=${env#pr}" >> "$GITHUB_OUTPUT"
        else
          echo "pr_number=$env" >> "$GITHUB_OUTPUT"
        fi

    - name: Determine if proxy has been deployed
      if: ${{ inputs.testType == 'sandbox' }}
      id: check_proxy_deployed
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        PR_NUMBER: ${{ steps.set_pr_number.outputs.pr_number }}
      shell: bash
      run: |
        if [[ -z "$PR_NUMBER" ]]; then
          echo "No pull request detected; proxy was deployed."
          echo "proxy_deployed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        branch_name=${GITHUB_HEAD_REF:-$(echo "$GITHUB_REF" | sed 's#refs/heads/##')}

        labels=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
        echo "Labels on PR #$PR_NUMBER: $labels"

        if echo "$labels" | grep -Fxq 'deploy-proxy'; then
          echo "proxy_deployed=true" >> "$GITHUB_OUTPUT"
        else
          echo "proxy_deployed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Repo setup
      uses: ./.github/actions/node-install
      with:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

    - name: Fetch terraform output
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: terraform-output-${{ inputs.targetComponent }}

    - name: Get Node version
      id: nodejs_version
      shell: bash
      run: |
        echo "nodejs_version=$(grep "^nodejs\s" .tool-versions | cut -f2 -d' ')" >> $GITHUB_OUTPUT

    - name: Set sandbox URL
      if: ${{ inputs.testType == 'sandbox' }}
      shell: bash
      env:
        TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
      run: |
        if [[ "$TARGET_ENVIRONMENT" == pr* ]]; then
          echo "SUPPLIER_API_URL_SANDBOX=https://internal-dev-sandbox.api.service.nhs.uk/nhs-notify-supplier-PR-${TARGET_ENVIRONMENT#pr}" >> "$GITHUB_ENV"
        else
          echo "SUPPLIER_API_URL_SANDBOX=https://internal-dev-sandbox.api.service.nhs.uk/nhs-notify-supplier" >> "$GITHUB_ENV"
        fi

    - name: Run test - ${{ inputs.testType }}
      if: ${{ inputs.testType != 'sandbox' || steps.check_proxy_deployed.outputs.proxy_deployed == 'true' }}
      shell: bash
      env:
        TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
        TARGET_ACCOUNT_GROUP: ${{ inputs.targetAccountGroup }}
      run: |
        make test-${{ inputs.testType }}
