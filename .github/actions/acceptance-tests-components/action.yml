name: Acceptance tests - component
description: "Run component acceptance tests for this repo"

inputs:
  testType:
    description: Type of test to run
    required: true

  targetEnvironment:
    description: Name of the environment under test
    required: true

  targetComponent:
    description: Name of the component under test
    required: true

  targetAccountGroup:
    description: Name of the account group under test (e.g. nhs-notify-supplier-api-dev)
    required: true

runs:
  using: "composite"

  steps:

    - name: Repo setup
      uses: ./.github/actions/node-install
      with:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

    - name: Fetch terraform output
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: terraform-output-${{ inputs.targetComponent }}

    - name: Get Node version
      id: nodejs_version
      shell: bash
      run: |
        echo "nodejs_version=$(grep "^nodejs\s" .tool-versions | cut -f2 -d' ')" >> $GITHUB_OUTPUT

    - name: Set sandbox URL
      if: ${{ inputs.testType == 'sandbox' }}
      shell: bash
      env:
        TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
      run: |
        if [[ "$TARGET_ENVIRONMENT" == pr* ]]; then
          echo "SUPPLIER_API_URL_SANDBOX=https://internal-dev-sandbox.api.service.nhs.uk/nhs-notify-supplier-PR-${TARGET_ENVIRONMENT#pr}" >> "$GITHUB_ENV"
        else
          echo "SUPPLIER_API_URL_SANDBOX=https://internal-dev-sandbox.api.service.nhs.uk/nhs-notify-supplier" >> "$GITHUB_ENV"
        fi

    - name: Run test - ${{ inputs.testType }}
      shell: bash
      env:
        TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
        TARGET_ACCOUNT_GROUP: ${{ inputs.targetAccountGroup }}
      run: |
        echo "VLASIS - event_name = ${{ github.event_name }}"
        echo "VLASIS - targetEnvironment = ${{ inputs.targetEnvironment }}"
        echo "VLASIS - SUPPLIER_API_URL_SANDBOX = $SUPPLIER_API_URL_SANDBOX"
        make test-${{ inputs.testType }}
