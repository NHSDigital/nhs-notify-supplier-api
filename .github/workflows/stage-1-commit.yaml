name: "Commit stage"

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      build_datetime:
        description: "Build datetime, set by the CI/CD pipeline workflow"
        required: true
        type: string
      build_timestamp:
        description: "Build timestamp, set by the CI/CD pipeline workflow"
        required: true
        type: string
      build_epoch:
        description: "Build epoch, set by the CI/CD pipeline workflow"
        required: true
        type: string
      version:
        description: "Version of the software, set by the CI/CD pipeline workflow"
        required: true
        type: string

jobs:
  scan-secrets:
    name: "Scan secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history is needed to scan all commits
      - name: "Scan secrets"
        uses: NHSDigital/nhs-notify-shared-modules/.github/actions/scan-secrets@a818108235ee15a5f49bcecf62f4732b94246f67 # 6.1.0
  validate-action-pins:
    name: "Validate action SHA pins"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Validate action SHA pins"
        uses: NHSDigital/nhs-notify-shared-modules/.github/actions/validate-action-pins@a818108235ee15a5f49bcecf62f4732b94246f67 # 6.1.0
  check-file-format:
    name: "Check file format"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history is needed to compare branches
      - name: "Check file format"
        uses: NHSDigital/nhs-notify-shared-modules/.github/actions/check-file-format@a818108235ee15a5f49bcecf62f4732b94246f67 # 6.1.0
  check-markdown-format:
    name: "Check Markdown format"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history is needed to compare branches
      - name: "Check Markdown format"
        uses: NHSDigital/nhs-notify-shared-modules/.github/actions/check-markdown-format@a818108235ee15a5f49bcecf62f4732b94246f67 # 6.1.0
  check-todo-usage:
    name: "Check TODO usage"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history is needed to compare branches
      - name: "Check TODO usage"
        uses: NHSDigital/nhs-notify-shared-modules/.github/actions/check-todo-usage@a818108235ee15a5f49bcecf62f4732b94246f67 # 6.1.0
  detect-terraform-changes:
    name: "Detect Terraform Changes"
    runs-on: ubuntu-latest
    outputs:
      terraform_changed: ${{ steps.check.outputs.terraform_changed }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Check for Terraform changes"
        id: check
        run: |
          git fetch origin main || true  # Ensure you have the latest main branch
          CHANGED_FILES=$(git diff --name-only HEAD origin/main)
          echo "Changed files: $CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE '\.tf$'; then
            echo "Terraform files have changed."
            echo "terraform_changed=true" >> $GITHUB_OUTPUT
          else
            echo "No Terraform changes detected."
            echo "terraform_changed=false" >> $GITHUB_OUTPUT
          fi
  lint-terraform:
    name: "Lint Terraform"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-terraform-changes
    if: needs.detect-terraform-changes.outputs.terraform_changed == 'true'
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Setup mise"
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: true
      - name: "Install locked Terraform"
        run: mise --locked install terraform
        env:
          MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
      - name: "Lint Terraform"
        uses: NHSDigital/nhs-notify-shared-modules/.github/actions/lint-terraform@a818108235ee15a5f49bcecf62f4732b94246f67 # 6.1.0
  count-lines-of-code:
    name: "Count lines of code"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Count lines of code"
        uses: NHSDigital/nhs-notify-shared-modules/.github/actions/create-lines-of-code-report@a818108235ee15a5f49bcecf62f4732b94246f67 # 6.1.0
        with:
          build_datetime: "${{ inputs.build_datetime }}"
          build_timestamp: "${{ inputs.build_timestamp }}"
          idp_aws_report_upload_account_id: "${{ secrets.IDP_AWS_REPORT_UPLOAD_ACCOUNT_ID }}"
          idp_aws_report_upload_region: "${{ secrets.IDP_AWS_REPORT_UPLOAD_REGION }}"
          idp_aws_report_upload_role_name: "${{ secrets.IDP_AWS_REPORT_UPLOAD_ROLE_NAME }}"
          idp_aws_report_upload_bucket_endpoint: "${{ secrets.IDP_AWS_REPORT_UPLOAD_BUCKET_ENDPOINT }}"
  scan-dependencies:
    name: "Scan dependencies"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    timeout-minutes: 5
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Scan dependencies"
        uses: NHSDigital/nhs-notify-shared-modules/.github/actions/scan-dependencies@a818108235ee15a5f49bcecf62f4732b94246f67 # 6.1.0
        with:
          build_datetime: "${{ inputs.build_datetime }}"
          build_timestamp: "${{ inputs.build_timestamp }}"
          idp_aws_report_upload_account_id: "${{ secrets.IDP_AWS_REPORT_UPLOAD_ACCOUNT_ID }}"
          idp_aws_report_upload_region: "${{ secrets.IDP_AWS_REPORT_UPLOAD_REGION }}"
          idp_aws_report_upload_role_name: "${{ secrets.IDP_AWS_REPORT_UPLOAD_ROLE_NAME }}"
          idp_aws_report_upload_bucket_endpoint: "${{ secrets.IDP_AWS_REPORT_UPLOAD_BUCKET_ENDPOINT }}"

  detect-event-schema-package-changes:
    name: "Check for changes to event schema package compared to main branch"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      main_version: ${{ steps.check.outputs.main_version }}

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect package changes and current version
        id: check
        run: |
          git fetch origin main

          if git diff --quiet origin/main...HEAD -- internal/events; then
            echo "No changes in event schemas package"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in event schemas"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

          if content=$(git show origin/main:internal/events/package.json 2>/dev/null); then
            version=$(jq -r .version <<< $content);
          else
            version=null;
          fi

          echo "Detected package version $version in main branch"
          echo "main_version=$version" >> $GITHUB_OUTPUT

  check-schema-version-change:
    name: Check event schema version has been updated
    needs: detect-event-schema-package-changes
    if: needs.detect-event-schema-package-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check schema versions
        run: |
          source scripts/is_valid_increment.sh

          main_version="${{ needs.detect-event-schema-package-changes.outputs.main_version }}"
          echo "Main version: ${{ needs.detect-event-schema-package-changes.outputs.main_version }}"

          local_version=$(jq -r '.version' internal/events/package.json)
          echo "Local version: $local_version"

          if ! is_valid_increment "$main_version" "$local_version" ; then
            echo "Error: Event Schema package has changed, but new version ($local_version) is not a valid increment from latest version on main branch ($main_version)."
            exit 1
          fi

  check-event-schemas-version-change:
    name: Check for event schemas package version change
    needs: detect-event-schema-package-changes
    if: needs.detect-event-schema-package-changes.outputs.changed == 'true'
    outputs:
      version_changed: ${{ steps.check-version.outputs.version_changed }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and pnpm from mise
        uses: ./.github/actions/node-install
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          install_dependencies: "false"

      - name: check if local version differs from latest published version
        id: check-version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published_version=$(pnpm view @nhsdigital/nhs-notify-event-schemas-supplier-api --json 2>/dev/null | jq -r '.["dist-tags"].latest // "null"')
          echo "Published version: $published_version"

          local_version=$(jq -r '.version' internal/events/package.json)
          echo "Local version: $local_version"

          if [[ $local_version = $published_version ]]; then
            echo "ERROR: Local version is the same as the latest published version, but event schemas have changed"
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "Local version is different to the latest published version - a new version will be published"
            echo "version_changed=true" >> $GITHUB_OUTPUT
          fi
