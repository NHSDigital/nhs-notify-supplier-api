name: PR Destroy Environment

on:
  pull_request:
    types: [closed]
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  destroy-dynamic-environment:
    name: Destroy Dynamic Environment
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Generate GitHub App token for nhs-notify-internal access"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          repositories: nhs-notify-internal
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PEM_FILE }}

      - name: Trigger dynamic environment destruction
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          .github/scripts/dispatch_internal_repo_workflow.sh \
            --infraRepoName "$(echo ${{ github.repository }} | cut -d'/' -f2)" \
            --releaseVersion "main" \
            --targetWorkflow "dispatch-deploy-dynamic-env.yaml" \
            --targetEnvironment "pr${{ github.event.number }}" \
            --targetComponent "api" \
            --targetAccountGroup "nhs-notify-supplier-api-dev" \
            --terraformAction "destroy" \
            --overrideRoleName "nhs-main-acct-supplier-api-github-deploy"

  destroy-dynamic-proxy:
    name: Destroy Dynamic Proxy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Generate GitHub App token for nhs-notify-internal access"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          repositories: nhs-notify-internal
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PEM_FILE }}

      - name: Trigger PR sandbox proxy destruction
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          .github/scripts/dispatch_internal_repo_workflow.sh \
          --infraRepoName "nhs-notify-supplier-api" \
          --releaseVersion "main" \
          --targetComponent "api" \
          --targetWorkflow "proxy-destroy.yaml" \
          --targetEnvironment "pr${{ github.event.number }}" \
          --apimEnvironment "internal-dev-sandbox" \
          --boundedContext "notify-supplier"

      - name: Trigger PR proxy destruction
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          .github/scripts/dispatch_internal_repo_workflow.sh \
          --infraRepoName "nhs-notify-supplier-api" \
          --releaseVersion "main" \
          --targetComponent "api" \
          --targetWorkflow "proxy-destroy.yaml" \
          --targetEnvironment "pr${{ github.event.number }}" \
          --apimEnvironment "internal-dev" \
          --boundedContext "notify-supplier"
