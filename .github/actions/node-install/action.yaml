name: 'pnpm install and setup'
description: 'Setup node, authenticate github package repository and perform clean pnpm install'

inputs:
  GITHUB_TOKEN:
    description: "Token for access to github package registry"
    required: true

runs:
  using: 'composite'
  steps:

    - name: Get tool versions
      id: get-tool-versions
      shell: bash
      run: |
        echo "nodejs_version=$(awk '$1 == "nodejs" { print $2; exit }' .tool-versions)" >> "$GITHUB_OUTPUT"
        echo "pnpm_version=$(awk '$1 == "pnpm" { print $2; exit }' .tool-versions)" >> "$GITHUB_OUTPUT"

    - name: 'Setup pnpm'
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: ${{ steps.get-tool-versions.outputs.pnpm_version }}

    - name: 'Use Node.js'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: '.tool-versions'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@nhsdigital'
        cache: 'pnpm'

    - name: 'Install dependencies'
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.GITHUB_TOKEN }}
      run: |
        pnpm install --frozen-lockfile
